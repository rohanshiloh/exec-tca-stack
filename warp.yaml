---
# Warp launch configuration: exec-tca-stack, one process per tab.
# Install: cp warp.yaml ~/.warp/launch_configurations/exec-tca-stack.yaml
# Run:     Command Palette → "Launch Configuration" → exec-tca-stack
# The printf sets the terminal title, so each pane keeps its name instead of
# showing the running command. The sleeps let each subscriber start after the
# process it connects to is listening.
#   blue = feed → tickerplant   green = stores   magenta = TCA subtree   yellow = you
name: exec-tca-stack
windows:
  - tabs:
      - title: TP 5010
        color: blue
        layout:
          cwd: ~/Code/exec-tca-stack
          commands:
            - exec: printf "\033]0;TP 5010\007"; q tick.q sym ./log -p 5010
      - title: RDB 5011
        color: green
        layout:
          cwd: ~/Code/exec-tca-stack
          commands:
            - exec: printf "\033]0;RDB 5011\007"; sleep 1 && q tick/r.q :5010 -p 5011
      - title: HDB 5012
        color: green
        layout:
          cwd: ~/Code/exec-tca-stack
          commands:
            - exec: printf "\033]0;HDB 5012\007"; q sym.q -p 5012
      - title: CHAIN 5013
        color: magenta
        layout:
          cwd: ~/Code/exec-tca-stack
          commands:
            - exec: printf "\033]0;CHAIN 5013\007"; sleep 1 && q tick/chainedtick.q :5010 -p 5013
      - title: TCA 5014
        color: magenta
        layout:
          cwd: ~/Code/exec-tca-stack
          commands:
            - exec: printf "\033]0;TCA 5014\007"; sleep 2 && q tca.q :5013 -p 5014
      - title: FEED
        color: blue
        layout:
          cwd: ~/Code/exec-tca-stack
          commands:
            - exec: printf "\033]0;FEED\007"; sleep 3 && q feed.q :5010
      - title: CTRL
        color: yellow
        layout:
          cwd: ~/Code/exec-tca-stack
          commands:
            - exec: printf "\033]0;CTRL\007"; q lab.q
    active_tab_index: 6
active_window_index: 0
